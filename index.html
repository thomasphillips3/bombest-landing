<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bombest Audio - Professional Mixing, Boutique Plugins, Sonic Experiments. Detroit soul meets next-gen tech." />
  <title>Bombest Audio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #1a1a1a, #0d0d0d);
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 2rem;
      background: linear-gradient(145deg, #111, #222);
      flex: 1;
    }

    .logo-container {
      margin-bottom: 2rem;
    }

    .logo-container img {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
      transition: transform 0.3s ease;
    }

    .logo-container img:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 3rem;
      margin: 0.2em 0;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 1.2rem;
      color: #ccc;
      max-width: 700px;
      line-height: 1.6;
      margin: 1rem auto 2rem;
    }

    .cta {
      margin-top: 2rem;
    }

    .cta a {
      text-decoration: none;
      background-color: #fff;
      color: #000;
      padding: 1rem 2.5rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cta a:hover {
      background-color: #ff0033;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 0, 51, 0.3);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #777;
      background: #0a0a0a;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .logo-container img {
        width: 150px;
      }

      .hero {
        padding: 4rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="logo-container">
      <img src="bombest-logo.png" alt="Bombest Audio Logo" />
    </div>
    <h1>Bombest Audio</h1>
    <p class="tagline">
      Professional Mixing. Boutique Plugins. Sonic Experiments.<br>
      Detroit soul meets next-gen tech. Welcome to the future of sound.
    </p>
    <div class="cta">
      <a href="mailto:thomas@bom.best">Contact</a>
    </div>
  </section>

  <footer>
    &copy; 2025 Bombest LLC — Designed by Thomas da Bombest
  </footer>
</body>
</html>
